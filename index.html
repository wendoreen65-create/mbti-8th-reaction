                    "shadowFunctions": [
                        {"role": "5th 对立功能", "name": "Ne (外倾直觉)", "desc": "排斥各种“如果当时…”的无用假设。"},
                        {"role": "6th 批判功能", "name": "Ti (内倾思考)", "desc": "在脑海中严密推理是谁、在哪个环节偷了包，并批判安保系统。"},
                        {"role": "7th 盲点功能", "name": "Fe (外倾情感)", "desc": "对同行者的惊慌失措感到厌烦，认为那是添乱。"},
                        {"role": "8th 恶魔功能", "name": "Si (内倾感觉)", "desc": "死抠刚才发生的细节，陷入强迫症般的重现循环。"}
                    ]
                },
                 "DEFAULT": {
                    "coreReaction": "面对突发危机的应急反应。",
                    "functions": [
                        {"role": "1st 主导功能", "name": "主导 (Dominant)", "desc": "危机时刻的首要判断依据。"},
                        {"role": "2nd 辅助功能", "name": "辅助 (Auxiliary)", "desc": "解决危机的工具与手段。"},
                        {"role": "3rd 第三功能", "name": "第三 (Tertiary)", "desc": "危机中的情绪与认知调节。"},
                        {"role": "4th 劣势功能", "name": "劣势 (Inferior)", "desc": "压力下可能导致的失误或崩溃。"}
                    ],
                    "behaviors": ["具体的危机应对行为"],
                    "advice": {"action": "提供清晰的行动指南。", "psychology": "危机后的心理重建。"},
                    "shadowFunctions": [
                        {"role": "5th 对立功能", "name": "对立 (Opposing)", "desc": "对危机的负面应对。"},
                        {"role": "6th 批判功能", "name": "批判 (Critical)", "desc": "对责任的追究。"},
                        {"role": "7th 盲点功能", "name": "盲点 (Trickster)", "desc": "危机处理中的盲区。"},
                        {"role": "8th 恶魔功能", "name": "恶魔 (Demon)", "desc": "极端危机下的破坏性行为。"}
                    ]
                }
            }
        };

        const DEFAULT_BG = "https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=2500";

        function App() {
            const [situation, setSituation] = useState('');
            const [selectedMbti, setSelectedMbti] = useState('INFP');
            const [displayMbti, setDisplayMbti] = useState('INFP');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');
            const [bgImage, setBgImage] = useState(DEFAULT_BG);

            const handleGenerate = async () => {
                if (!situation.trim()) { setError('请输入具体的情境！'); return; }
                
                setError(''); setResult(null); setDisplayMbti(selectedMbti);

                // 检查是否命中硬编码的预设情境
                if (PRESET_RESULTS[situation]) {
                    const presetData = PRESET_RESULTS[situation][selectedMbti] || PRESET_RESULTS[situation]["DEFAULT"];
                    setResult(presetData);
                    return; // 命中预设，直接返回，不调用API
                }

                // 未命中预设，调用API
                const apiKey = "sk-02c64907d4564bf7a2f3fe76dff605e1"; // 已回退为内置 API
                const apiUrl = "https://api.deepseek.com/chat/completions";

                setLoading(true);

                const systemPrompt = `你是一个精通荣格八维和MBTI的心理推演专家。客观、极简、禁止煽情。必须返回纯JSON格式，严禁包含Markdown代码块标识。
                推演要求：针对设定的情境和主角性格，直接推演其心理运作。
                注意：
                1. 描述必须直接进入分析核心，禁止使用“XX功能启动/激活”、“通过XX功能...”等开场白，请直接描述具体的认知逻辑。
                2. functions 的 role 字段必须依次为："1st 主导功能"、"2nd 辅助功能"、"3rd 第三功能"、"4th 劣势功能"。
                3. shadowFunctions 的 role 字段必须依次为："5th 对立功能"、"6th 批判功能"、"7th 盲点功能"、"8th 恶魔功能"。
                4. name 字段请写出英文缩写及中文全称，如 "Ni (内倾直觉)"。
                JSON结构：{ 
                    "coreReaction": "一句话核心反应", 
                    "functions": [{"role": "序号+职能中文", "name": "缩写(全称)", "desc": "描述具体想法(少于30字)"}], 
                    "behaviors": ["行为预测"], 
                    "advice": {"action": "具体建议", "psychology": "心态参考"}, 
                    "shadowFunctions": [{"role": "序号+职能中文", "name": "缩写(全称)", "desc": "描述具体想法(少于30字)"}] 
                }`;

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: "deepseek-chat",
                            messages: [
                                { role: "system", content: systemPrompt },
                                { role: "user", content: `情境：${situation}\n主角：${selectedMbti}` }
                            ],
                            stream: false,
                            response_format: { "type": "json_object" }
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(`[${response.status}] ${data.error?.message || "接口异常"}`);

                    let content = data.choices[0].message.content;
                    content = content.replace(/```json\n?/, '').replace(/\n?```/, '').trim();
                    setResult(JSON.parse(content));
                } catch (err) {
                    console.error("API Error:", err);
                    setError(`推演失败。原因：${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const avatarUrl = (id) => `https://www.16personalities.com/static/images/personality-types/avatars/${id.toLowerCase()}-${MBTI_TYPES.find(t=>t.id===id).eng}.svg`;

            return (
                <div className="min-h-screen font-healing text-white selection:bg-[#fffaa1]/30 relative overflow-x-hidden p-4 md:p-8">
                    {/* 背景与滤镜 */}
                    <div className="fixed inset-0 z-0 bg-cover bg-center transition-all duration-1000 saturate-[1.2]" style={{ backgroundImage: `url('${bgImage}')` }}>
                        <div className="absolute inset-0 bg-black/40 backdrop-blur-[12px]"></div>
                        <div className="absolute inset-0 bg-gradient-to-b from-[#1a1c29]/30 via-transparent to-[#0c0d14]/90"></div>
                    </div>
                    
                    {/* 气泡动画 */}
                    <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden mix-blend-screen">
                        {[...Array(15)].map((_, i) => (
                            <div key={i} className={`absolute rounded-full animate-float opacity-[0.25] blur-[2px] ${['bg-[#e9d2e6]','bg-[#fffaa1]','bg-[#a0d9e8]','bg-[#d8ef74]'][i%4]}`}
                                style={{ width: `${Math.random()*40+15}px`, height: `${Math.random()*40+15}px`, left: `${Math.random()*100}%`, bottom: '-15%', animationDuration: `${12+Math.random()*8}s`, animationDelay: `${i*1.1}s` }}>
                                <div className="absolute top-[15%] left-[20%] w-1/4 h-1/4 bg-white/50 rounded-full blur-[1px]"></div>
                            </div>
                        ))}
                    </div>

                    <div className="relative z-10 max-w-7xl mx-auto flex flex-col gap-6">
                        <header className="text-center py-4">
                            <h1 className="text-5xl md:text-7xl font-cursive bg-clip-text text-transparent bg-gradient-to-r from-[#fffaa1] via-[#a0d9e8] to-[#e9d2e6] drop-shadow-lg text-white font-bold">Cognitive Dynamics</h1>
                            <p className="text-xs tracking-[0.4em] opacity-50 mt-3 font-light uppercase tracking-widest text-white">基于荣格八维的心智推演系统</p>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                            {/* 控制区域 */}
                            <div className="lg:col-span-5 flex flex-col gap-6">

                                <div className="glass-panel p-6 rounded-[2.5rem] space-y-4 transition-all shadow-xl">
                                    <label className="text-[#fffaa1] text-xs font-bold tracking-widest flex items-center gap-2 drop-shadow-sm uppercase">
                                        <Icon name="Compass" color="#fffaa1" /> 设定情境 / Context
                                    </label>
                                    
                                    <div className="flex flex-wrap gap-2 mb-2">
                                        {PRESET_SCENARIOS.map(s => (
                                            <button key={s.id} onClick={() => setSituation(s.content)}
                                                className="scenario-pill px-3 py-1.5 rounded-full text-[10px] text-[#fffaa1]/90 font-bold">
                                                #{s.tag} {s.title}
                                            </button>
                                        ))}
                                    </div>

                                    <textarea value={situation} onChange={e => setSituation(e.target.value)} 
                                        className="w-full h-36 bg-black/40 border border-[#fffaa1]/20 rounded-2xl p-4 text-sm focus:outline-none focus:border-[#fffaa1]/60 transition-all placeholder:opacity-30 leading-relaxed font-healing text-white"
                                        placeholder="请描述一个具体的冲突情境..." 
                                    />
                                </div>

                                <div className="glass-panel p-6 rounded-[2.5rem] space-y-4 shadow-xl">
                                    <label className="text-[#e9d2e6] text-xs font-bold tracking-widest flex items-center gap-2 uppercase drop-shadow-sm font-bold">
                                        <Icon name="User" color="#e9d2e6" /> 目标主角 / Subject
                                    </label>
                                    <div className="grid grid-cols-4 gap-2.5">
                                        {MBTI_TYPES.map(t => (
                                            <button key={t.id} onClick={() => setSelectedMbti(t.id)}
                                                className={`flex flex-col items-center p-2 rounded-2xl transition-all border duration-300 ${selectedMbti === t.id ? 'mbti-btn-active' : 'bg-white/5 border-transparent opacity-40 hover:opacity-100'}`}>
                                                <img src={avatarUrl(t.id)} className="w-9 h-9" />
                                                <span className={`text-[10px] mt-1.5 font-bold tracking-tighter ${selectedMbti === t.id ? 'text-white' : 'text-slate-300'}`}>{t.id}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex flex-col gap-3">
                                    <div className="flex justify-between items-center px-2 mb-1">
                                        <label className="text-[10px] opacity-40 hover:opacity-100 cursor-pointer flex items-center gap-2 transition-opacity font-bold uppercase">
                                            <Icon name="Image" size={12} /> Bg Image <input type="file" className="hidden" onChange={e => setBgImage(URL.createObjectURL(e.target.files[0]))} />
                                        </label>
                                        {bgImage !== DEFAULT_BG && <button onClick={() => setBgImage(DEFAULT_BG)} className="text-[10px] opacity-40 hover:text-red-400 font-bold uppercase">Reset</button>}
                                    </div>
                                    
                                    <button onClick={handleGenerate} disabled={loading} 
                                        className="w-full py-4.5 bg-[#fffaa1] text-[#2d2e14] font-black rounded-3xl tracking-[0.2em] shadow-xl active:scale-95 transition-all disabled:opacity-50 relative overflow-hidden group">
                                        <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                                        <span className="relative z-10">{loading ? '解码中...' : '解码心智回路'}</span>
                                    </button>

                                    {error && <div className="text-[#fffaa1] text-[11px] p-4 bg-red-900/30 border border-red-500/30 rounded-2xl leading-relaxed text-center shadow-lg mt-2">{error}</div>}
                                </div>
                            </div>

                            {/* 结果显示 */}
                            <div className="lg:col-span-7 h-full">
                                <div className={`glass-panel p-6 md:p-10 rounded-[3rem] min-h-[600px] flex flex-col transition-all duration-500 ${!result && !loading ? 'justify-center items-center text-center' : ''}`}>
                                    {!result && !loading ? (
                                        <div className="opacity-30 flex flex-col items-center gap-6 animate-pulse text-white">
                                            <Icon name="Brain" size={80} />
                                            <div>
                                                <p className="text-2xl font-black tracking-[0.3em] uppercase">Awaiting Signal</p>
                                                <p className="text-sm font-light mt-2 italic">设定左侧情境并点击解码。</p>
                                            </div>
                                        </div>
                                    ) : loading ? (
                                        <div className="flex-1 flex flex-col items-center justify-center space-y-6">
                                            <div className="relative">
                                                <div className="w-24 h-24 border-2 border-[#fffaa1]/40 rounded-full animate-[ping_2s_infinite]"></div>
                                                <Icon name="Zap" color="#fffaa1" size={32} className="absolute inset-0 m-auto" />
                                            </div>
                                            <p className="text-[#fffaa1] font-black tracking-[0.2em] uppercase text-lg">解码中...</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-8 animate-in fade-in slide-in-from-bottom-6 duration-700">
                                            <div className="flex items-center space-x-5 border-b border-white/10 pb-6">
                                                <img src={avatarUrl(displayMbti)} className="w-16 h-16 drop-shadow-lg" />
                                                <div>
                                                    <h2 className="text-2xl md:text-3xl font-black tracking-wide uppercase text-white">{displayMbti} 心智投影</h2>
                                                </div>
                                            </div>

                                            <div className="bg-[#fffaa1]/10 border border-[#fffaa1]/30 p-6 rounded-[2rem] relative overflow-hidden group shadow-inner">
                                                <div className="absolute top-0 right-0 w-32 h-32 bg-[#fffaa1]/10 blur-3xl -mr-10 -mt-10 rounded-full"></div>
                                                <h4 className="text-[#fffaa1] text-[10px] font-black tracking-widest mb-1.5 opacity-80 uppercase">Core Instinct / 核心本能</h4>
                                                <p className="text-base md:text-lg font-bold leading-relaxed text-white">{result.coreReaction}</p>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {result.functions.map((f, i) => (
                                                    <div key={i} className="bg-white/5 p-5 rounded-2xl border border-[#fffaa1]/15 hover:border-[#fffaa1]/50 transition-all shadow-sm">
                                                        <div className="flex justify-between items-center mb-3">
                                                            <span className="text-[10px] text-[#fffaa1] font-black uppercase opacity-60 tracking-tighter">{f.role}</span>
                                                            <span className="text-[10px] bg-[#fffaa1] text-[#2d2e14] px-2.5 py-0.5 rounded-full font-black">{f.name}</span>
                                                        </div>
                                                        <p className="text-[13px] opacity-90 leading-relaxed font-light text-white font-healing">{f.desc}</p>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="bg-[#a0d9e8]/5 border border-[#a0d9e8]/30 p-6 rounded-[2rem] shadow-sm">
                                                <h4 className="text-[#a0d9e8] text-[10px] font-black mb-4 flex items-center gap-2 tracking-widest uppercase">
                                                    <Icon name="ChevronRight" color="#a0d9e8" size={14} /> Behaviors / 行为预测
                                                </h4>
                                                <ul className="space-y-3">
                                                    {result.behaviors.map((b, i) => (
                                                        <li key={i} className="text-sm opacity-90 leading-snug flex items-start gap-3 font-light font-healing text-white">
                                                            <span className="w-1.5 h-1.5 bg-[#a0d9e8] mt-1.5 rounded-full shrink-0 shadow-[0_0_8px_#a0d9e8]"></span> {b}
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="bg-[#d8ef74]/10 border border-[#d8ef74]/30 p-5 rounded-2xl shadow-sm">
                                                    <div className="text-[#d8ef74] text-[9px] font-black mb-2 tracking-widest opacity-80 uppercase flex items-center gap-2 text-white"><Icon name="Zap" size={12} color="#d8ef74" /> Action / 行动指南</div>
                                                    <p className="text-xs leading-relaxed opacity-90 font-medium text-white font-healing">{result.advice.action}</p>
                                                </div>
                                                <div className="bg-[#d8ef74]/10 border border-[#d8ef74]/30 p-5 rounded-2xl shadow-sm">
                                                    <div className="text-[#d8ef74] text-[9px] font-black mb-2 tracking-widest opacity-80 uppercase flex items-center gap-2 text-white"><Icon name="Heart" size={12} color="#d8ef74" /> Psyche / 心理调节</div>
                                                    <p className="text-xs leading-relaxed opacity-90 font-medium text-white font-healing">{result.advice.psychology}</p>
                                                </div>
                                            </div>

                                            <div className="relative pt-10 pb-4">
                                                <div className="absolute inset-0 flex items-center px-4"><div className="w-full border-t border-[#e9d2e6]/20"></div></div>
                                                <div className="relative flex justify-center">
                                                    <span className="bg-[#10121a] border border-[#e9d2e6]/20 px-6 py-2 rounded-full text-[9px] text-[#e9d2e6] tracking-[0.4em] font-black uppercase shadow-lg">潜意识阴暗面 / Shadow Projection</span>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4 opacity-70 hover:opacity-100 transition-opacity">
                                                {result.shadowFunctions?.map((f, i) => (
                                                    <div key={i} className="bg-black/30 p-4 rounded-2xl border border-[#e9d2e6]/10 shadow-inner">
                                                        <div className="flex justify-between items-center mb-2">
                                                            <span className="text-[8px] text-[#e9d2e6] uppercase font-black opacity-60">{f.role}</span>
                                                            <span className="text-[8px] border border-[#e9d2e6]/40 text-[#e9d2e6] px-1.5 rounded font-bold">{f.name}</span>
                                                        </div>
                                                        <p className="text-[13px] opacity-100 font-normal leading-relaxed text-white not-italic font-healing">{f.desc}</p>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="h-10"></div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
